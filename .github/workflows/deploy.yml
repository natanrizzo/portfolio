name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deploys touch the VPS at the same time.
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gerar tipos de rota do Next
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  build:
    needs: verify
    runs-on: ubuntu-latest
    # Same environment as `deploy`: the NEXT_PUBLIC_* values are inlined into
    # the client bundle here, at build time. Without this the job cannot read
    # environment-scoped secrets and they arrive empty.
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      # These are inlined into the client bundle and cannot be fixed at
      # runtime. An empty value would silently ship a production build
      # pointing at localhost, so fail here with a message that says which
      # secret is missing.
      - name: Conferir os secrets de build
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
        run: |
          faltando=""
          [ -n "$SITE_URL" ] || faltando="${faltando} NEXT_PUBLIC_SITE_URL"
          [ -n "$CLOUD_NAME" ] || faltando="${faltando} NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME"
          if [ -n "$faltando" ]; then
            echo "Secrets vazios ou ausentes:${faltando}" >&2
            echo "Cadastre-os no repositório ou no environment 'production'." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Definir tags da imagem
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          echo "app=${IMAGE}-app:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "migrator=${IMAGE}-migrator:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}-app:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build e push da imagem da aplicação
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.meta.outputs.app }}
            ${{ env.REGISTRY }}/${{ github.repository }}-app:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push da imagem de migração
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ steps.meta.outputs.migrator }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Enviar docker-compose.yml para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.yml
          target: ${{ secrets.VPS_APP_DIR }}

      - name: Migrar e subir a nova versão
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"

            REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            export APP_IMAGE="ghcr.io/${REPO}-app:${IMAGE_TAG}"
            export MIGRATOR_IMAGE="ghcr.io/${REPO}-migrator:${IMAGE_TAG}"

            # Persist the tags so a manual `docker compose up` on the box uses
            # the same images this deploy just published.
            sed -i "/^APP_IMAGE=/d;/^MIGRATOR_IMAGE=/d" .env
            echo "APP_IMAGE=${APP_IMAGE}" >> .env
            echo "MIGRATOR_IMAGE=${MIGRATOR_IMAGE}" >> .env

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" --password-stdin

            docker compose pull app migrate

            # Back the database up before touching the schema, so a bad
            # migration is recoverable.
            docker compose exec -T db pg_dump -U "${POSTGRES_USER:-portfolio}" \
              -d "${POSTGRES_DB:-portfolio}" | gzip \
              > "pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz" || true

            docker compose run --rm migrate
            docker compose up -d --no-deps app

            # Wait for the health endpoint before calling it a success.
            for i in $(seq 1 30); do
              if docker compose exec -T app node -e \
                "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "Aplicação saudável."
                docker image prune -f
                exit 0
              fi
              sleep 2
            done

            echo "A nova versão não ficou saudável. Últimos logs:"
            docker compose logs --tail=50 app
            exit 1
